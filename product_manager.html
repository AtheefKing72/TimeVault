<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeVault Product Manager</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Use Inter font -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #eef2f5;
        }
        .btn-primary {
            background-color: #1a56db;
            transition: background-color 0.2s;
        }
        .btn-primary:hover {
            background-color: #0d46a8;
        }
    </style>
</head>
<body>

<!-- Firebase & Global Variable Setup -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot, collection, deleteDoc, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // IMPORTANT: Canvas provided global variables MUST be used
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
    const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

    // Firebase Initialization
    let app, db, auth;
    let userId = null;
    let isAuthReady = false;

    // Public Firestore Collection Path: /artifacts/{appId}/public/data/store_products
    const PRODUCTS_COLLECTION_NAME = 'store_products';
    const getProductsCollectionRef = () => collection(db, 'artifacts', appId, 'public', 'data', PRODUCTS_COLLECTION_NAME);

    // Global product list
    let products = [];
    let editingId = null; // Track if we are editing an existing product

    // Notification/Toast Function
    const showNotification = (message, colorClass = 'bg-green-500') => {
        const notificationEl = document.getElementById('notification');
        notificationEl.textContent = message;
        notificationEl.className = `fixed bottom-4 right-4 p-3 rounded-lg shadow-xl text-white ${colorClass} transition-opacity duration-300 z-50`;
        notificationEl.style.opacity = '1';
        setTimeout(() => {
            notificationEl.style.opacity = '0';
        }, 3000);
    };

    // --- CRUD Operations ---

    // 1. Save Product (Add or Edit)
    const saveProduct = async (e) => {
        e.preventDefault();
        if (!isAuthReady) return showNotification('Authentication pending.', 'bg-yellow-500');

        const form = e.target;
        const data = {
            id: editingId || crypto.randomUUID(), // Use existing ID if editing, otherwise new UUID
            name: form.name.value,
            description: form.description.value,
            price: parseFloat(form.price.value),
            img: form.img.value,
            link: form.link.value, // AliExpress link
            timestamp: new Date()
        };

        if (isNaN(data.price)) return showNotification('Price must be a valid number.', 'bg-red-500');

        try {
            const docRef = doc(getProductsCollectionRef(), data.id);
            await setDoc(docRef, data);

            showNotification(`${data.name} ${editingId ? 'updated' : 'added'} successfully!`, 'bg-indigo-600');
            
            // Reset form state
            form.reset();
            editingId = null;
            document.getElementById('form-title').textContent = 'Add New Product';
            document.getElementById('save-btn').textContent = 'Add Product';

        } catch (error) {
            console.error("Error saving product:", error);
            showNotification('Error: Failed to save product!', 'bg-red-500');
        }
    };

    // 2. Load Product for Editing
    window.editProduct = (id) => {
        const product = products.find(p => p.id === id);
        if (!product) return showNotification('Product not found.', 'bg-red-500');

        const form = document.getElementById('product-form');
        form.name.value = product.name;
        form.description.value = product.description;
        form.price.value = product.price.toFixed(2);
        form.img.value = product.img;
        form.link.value = product.link;

        editingId = id;
        document.getElementById('form-title').textContent = `Edit Product: ${product.name}`;
        document.getElementById('save-btn').textContent = 'Update Product';

        // Scroll to the form
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    // 3. Delete Product
    window.deleteProduct = async (id) => {
        if (!isAuthReady) return showNotification('Authentication pending.', 'bg-yellow-500');

        // Note: We use a custom modal replacement instead of window.confirm
        const modal = document.getElementById('confirm-modal');
        document.getElementById('confirm-message').textContent = 'Are you sure you want to delete this product? This action cannot be undone.';
        modal.classList.remove('hidden');

        document.getElementById('confirm-action-btn').onclick = async () => {
            modal.classList.add('hidden');
            try {
                await deleteDoc(doc(getProductsCollectionRef(), id));
                showNotification('Product successfully deleted!', 'bg-red-600');
            } catch (error) {
                console.error("Error deleting product:", error);
                showNotification('Error: Failed to delete product!', 'bg-red-500');
            }
        };

        document.getElementById('cancel-action-btn').onclick = () => {
            modal.classList.add('hidden');
        };
    };

    // 4. Render Products List (Real-time update)
    const renderProducts = () => {
        const listContainer = document.getElementById('products-list');
        listContainer.innerHTML = ''; // Clear previous list

        // Sort by timestamp (most recent first)
        products.sort((a, b) => b.timestamp.toDate().getTime() - a.timestamp.toDate().getTime());

        if (products.length === 0) {
            listContainer.innerHTML = '<p class="text-center text-gray-500 py-10">No products found. Add your first timepiece!</p>';
            return;
        }

        products.forEach(p => {
            listContainer.innerHTML += `
                <div class="flex items-center bg-white p-4 rounded-lg shadow-sm mb-4 border border-gray-100">
                    <img src="${p.img}" onerror="this.src='https://placehold.co/100x100?text=No+Image'" alt="${p.name}" class="w-16 h-16 object-cover rounded-md mr-4">
                    <div class="flex-grow">
                        <h3 class="text-lg font-semibold text-gray-800">${p.name}</h3>
                        <p class="text-sm text-gray-500">Price: $${p.price.toFixed(2)}</p>
                        <a href="${p.link}" target="_blank" class="text-xs text-blue-500 hover:text-blue-700 truncate block">${p.link}</a>
                    </div>
                    <div class="flex space-x-2">
                        <button onclick="window.editProduct('${p.id}')" class="bg-yellow-500 text-white p-2 rounded-full hover:bg-yellow-600 transition">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zm-5.464 5.464a2 2 0 000 2.828l3.142 3.142c.813.813 1.137 1.84.975 2.872a2 2 0 001.07-1.109l.45-1.077c.189-.452.417-.932.748-1.127.33-.194.757-.22 1.144-.083a2 2 0 001.272-1.84c.005-.183-.16-.364-.477-.478-.318-.114-.652-.164-.99-.089a2 2 0 00-1.87-1.87c-.114-.317-.164-.651-.089-.99a2 2 0 00-.478-.478c-1.107-.403-2.28-.962-3.142-1.824L11 9.586l-2.05-2.05c-.328-.328-.43-.762-.317-1.144a2 2 0 00-2.828-2.828z"/></svg>
                        </button>
                        <button onclick="window.deleteProduct('${p.id}')" class="bg-red-500 text-white p-2 rounded-full hover:bg-red-600 transition">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm4 0a1 1 0 10-2 0v6a1 1 0 102 0V8z" clip-rule="evenodd" /></svg>
                        </button>
                    </div>
                </div>
            `;
        });
    };

    // 5. Real-time Product Listener
    const loadAndListenToProducts = () => {
        if (!db || !isAuthReady) return;

        onSnapshot(getProductsCollectionRef(), (snapshot) => {
            products = [];
            snapshot.forEach(doc => {
                products.push(doc.data());
            });
            renderProducts();
            console.log("Products list updated from Firestore.");
        }, (error) => {
            console.error("Error listening to products:", error);
            showNotification('Error: Could not sync product data.', 'bg-red-500');
        });
    };

    // --- Initialization ---

    const initApp = async () => {
        try {
            setLogLevel('debug'); // Enable detailed logging for debugging Firestore

            if (Object.keys(firebaseConfig).length === 0) {
                 console.error("Firebase config is empty. Cannot initialize Firebase.");
                 document.getElementById('auth-status').textContent = 'Error: Firebase not configured.';
                 return;
            }

            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            
            // Handle authentication state
            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    userId = user.uid;
                } else if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                    userId = auth.currentUser.uid;
                } else {
                    // We sign in anonymously, but since this is an admin panel, 
                    // a real-world app would require full authentication.
                    await signInAnonymously(auth);
                    userId = auth.currentUser.uid;
                }
                
                isAuthReady = true;
                document.getElementById('auth-status').textContent = `Admin User ID: ${userId}`;
                
                // Start listening for product updates
                loadAndListenToProducts();
            });

            // Attach event listener to the form
            document.getElementById('product-form').addEventListener('submit', saveProduct);

        } catch (error) {
            console.error("Firebase/Authentication initialization failed:", error);
            document.getElementById('auth-status').textContent = 'Error: Auth failed. Check console.';
        }
    };
    
    window.addEventListener('load', initApp);

</script>

<div class="max-w-4xl mx-auto p-4 sm:p-8">
    <h1 class="text-4xl font-extrabold text-gray-900 mb-2">TimeVault Manager</h1>
    <p class="text-gray-600 mb-6">Manage products and affiliate links for the store.</p>
    <p id="auth-status" class="text-xs text-gray-500 mb-8"></p>

    <!-- Product Form -->
    <div class="bg-white p-6 sm:p-8 rounded-xl shadow-2xl mb-10">
        <h2 id="form-title" class="text-2xl font-bold text-[#1a56db] mb-6">Add New Product</h2>
        <form id="product-form" class="space-y-4">
            <input type="hidden" name="id" id="product-id">
            
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700">Product Name</label>
                <input type="text" name="name" id="name" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:border-indigo-500 focus:ring-indigo-500">
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label for="price" class="block text-sm font-medium text-gray-700">Price (USD)</label>
                    <input type="number" step="0.01" name="price" id="price" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:border-indigo-500 focus:ring-indigo-500">
                </div>
                 <div>
                    <label for="img" class="block text-sm font-medium text-gray-700">Image URL</label>
                    <input type="url" name="img" id="img" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:border-indigo-500 focus:ring-indigo-500" placeholder="e.g., https://placehold.co/600x400">
                </div>
            </div>

            <div>
                <label for="link" class="block text-sm font-medium text-gray-700">AliExpress Link (Affiliate URL)</label>
                <input type="url" name="link" id="link" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:border-indigo-500 focus:ring-indigo-500">
            </div>
            
            <div>
                <label for="description" class="block text-sm font-medium text-gray-700">Short Description</label>
                <textarea name="description" id="description" required rows="3" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:border-indigo-500 focus:ring-indigo-500"></textarea>
            </div>
            
            <button type="submit" id="save-btn" class="w-full btn-primary text-white font-semibold py-3 px-4 rounded-lg shadow-lg hover:shadow-xl transition duration-150">
                Add Product
            </button>
        </form>
    </div>

    <!-- Products List -->
    <h2 class="text-2xl font-bold text-gray-800 mb-4 mt-8">Current Inventory</h2>
    <div id="products-list" class="space-y-4">
        <!-- Products will be dynamically loaded here -->
        <p class="text-center text-gray-500 py-10">Loading products...</p>
    </div>

</div>

<!-- Confirmation Modal -->
<div id="confirm-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center hidden">
    <div class="bg-white p-6 rounded-lg shadow-2xl max-w-sm w-full">
        <h3 class="text-xl font-bold text-red-600 mb-4">Confirm Deletion</h3>
        <p id="confirm-message" class="text-gray-700 mb-6"></p>
        <div class="flex justify-end space-x-3">
            <button id="cancel-action-btn" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300">Cancel</button>
            <button id="confirm-action-btn" class="px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700">Delete Permanently</button>
        </div>
    </div>
</div>

<!-- Notification/Toast Area -->
<div id="notification" class="fixed bottom-4 right-4 p-3 rounded-lg shadow-xl text-white opacity-0 transition-opacity duration-300 z-50"></div>

</body>
</html>
